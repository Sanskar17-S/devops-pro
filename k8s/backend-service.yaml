apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: student-app
spec:
  type: ClusterIP
  selector:
    app: backend # ⚠️ Make sure this matches the label on your backend Deployment pods!
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000 # ⚠️ Make sure this matches the port your Node.js app listens on
